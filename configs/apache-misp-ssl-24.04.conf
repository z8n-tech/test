# Apache MISP SSL Configuration for Ubuntu 24.04
# MISP 2.4 with PHP 8.3

<VirtualHost *:80>
    ServerAdmin admin@misp.local
    ServerName misp.local

    # Redirect all HTTP to HTTPS
    Redirect permanent / https://misp.local/

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/misp_error.log
    CustomLog ${APACHE_LOG_DIR}/misp_access.log combined

    # Security Headers
    ServerSignature Off
    ServerTokens Prod
</VirtualHost>

<VirtualHost *:443>
    ServerAdmin admin@misp.local
    ServerName misp.local

    DocumentRoot /var/www/MISP/app/webroot

    <Directory /var/www/MISP/app/webroot>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Additional security
        <IfModule mod_headers.c>
            # Prevent MIME type sniffing
            Header set X-Content-Type-Options "nosniff"

            # Prevent clickjacking
            Header set X-Frame-Options "DENY"

            # Enable XSS protection
            Header set X-XSS-Protection "1; mode=block"

            # Content Security Policy
            Header set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none';"

            # Strict Transport Security (HSTS)
            Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"

            # Referrer Policy
            Header set Referrer-Policy "strict-origin-when-cross-origin"

            # Permissions Policy
            Header set Permissions-Policy "geolocation=(), microphone=(), camera=()"
        </IfModule>
    </Directory>

    # SSL Configuration
    SSLEngine On
    SSLCertificateFile /etc/ssl/private/misp.local.crt
    SSLCertificateKeyFile /etc/ssl/private/misp.local.key
    # SSLCertificateChainFile /etc/ssl/private/misp-chain.crt

    # Modern SSL Configuration (Mozilla Intermediate)
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder off
    SSLSessionTickets off

    # Enable HTTP/2
    Protocols h2 http/1.1

    # PHP-FPM Configuration (if using FPM instead of mod_php)
    # <FilesMatch \.php$>
    #     SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost"
    # </FilesMatch>

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/misp_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/misp_ssl_access.log combined

    # Security
    ServerSignature Off

    # Additional Performance Settings
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript application/json
    </IfModule>

    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType image/jpg "access plus 1 year"
        ExpiresByType image/jpeg "access plus 1 year"
        ExpiresByType image/gif "access plus 1 year"
        ExpiresByType image/png "access plus 1 year"
        ExpiresByType text/css "access plus 1 month"
        ExpiresByType application/pdf "access plus 1 month"
        ExpiresByType text/javascript "access plus 1 month"
        ExpiresByType application/javascript "access plus 1 month"
        ExpiresByType application/x-shockwave-flash "access plus 1 month"
        ExpiresByType image/x-icon "access plus 1 year"
        ExpiresDefault "access plus 2 days"
    </IfModule>
</VirtualHost>

# vim: syntax=apache ts=4 sw=4 sts=4 sr noet
