; PHP 8.3 Configuration for MISP
; Place this file in /etc/php/8.3/apache2/conf.d/99-misp.ini
; or /etc/php/8.3/fpm/conf.d/99-misp.ini if using PHP-FPM

[PHP]

; Maximum size of POST data that PHP will accept
post_max_size = 50M

; Maximum allowed size for uploaded files
upload_max_filesize = 50M

; Maximum execution time of each script, in seconds
max_execution_time = 300

; Maximum amount of time each script may spend parsing request data
max_input_time = 300

; Maximum amount of memory a script may consume
memory_limit = 2048M

; Maximum number of files that can be uploaded via a single request
max_file_uploads = 20

; Session configuration
session.save_handler = redis
session.save_path = "tcp://127.0.0.1:6379?database=0"
session.sid_length = 32
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = "Strict"
session.gc_maxlifetime = 3600
session.gc_probability = 1
session.gc_divisor = 100

; Disable exposing PHP version
expose_php = Off

; Disable display of errors in production
display_errors = Off
display_startup_errors = Off

; Log PHP errors
log_errors = On
error_log = /var/log/php/error.log

; Error reporting level
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Timezone
date.timezone = UTC

; OPcache configuration for better performance
[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 2
opcache.fast_shutdown = 1
opcache.validate_timestamps = 1

; JIT compilation (PHP 8.0+)
opcache.jit_buffer_size = 100M
opcache.jit = 1255

; Disable dangerous functions
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,curl_exec,curl_multi_exec,parse_ini_file,show_source

; Allow fopen URLs (required for some MISP features)
allow_url_fopen = On
allow_url_include = Off

; Increase limits for complex MISP operations
max_input_vars = 5000
max_input_nesting_level = 128

; File upload temporary directory
upload_tmp_dir = /var/www/MISP/app/tmp

; Default socket timeout
default_socket_timeout = 60

; MySQLi configuration
[mysqli]
mysqli.max_persistent = -1
mysqli.allow_persistent = On
mysqli.max_links = -1
mysqli.default_port = 3306
mysqli.default_socket =
mysqli.default_host =
mysqli.default_user =
mysqli.default_pw =
mysqli.reconnect = Off

; PDO configuration
[Pdo_mysql]
pdo_mysql.default_socket =

; Additional settings for MISP
[mbstring]
mbstring.language = Neutral
mbstring.internal_encoding = UTF-8
mbstring.http_output = UTF-8
mbstring.encoding_translation = Off

[gd]
; Enable bundled GD library
gd.jpeg_ignore_warning = 1
